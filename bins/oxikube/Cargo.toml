[package]
name = "oxikube"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Oxikube — native Kubernetes desktop client built with GPUI."
default-run = "oxikube"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "oxikube"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
dirs.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
# Declared now so the full GPUI stack resolves and builds from day one;
# feature crates will wire these through oxikube_ui (E05).
gpui-component.workspace = true
jiff.workspace = true
# `kube_ports`: the kube adapter's catalog and connector need kube-rs' `Kubeconfig` type.
kube.workspace = true
# `--perf` recorder and frame hook; `perf-harness` adds the scripted driver for `--perf-scenario`.
oxikube_app.workspace = true
oxikube_assets.workspace = true
oxikube_catalog_ui.workspace = true
oxikube_domain.workspace = true
oxikube_keymap.workspace = true
oxikube_describe.workspace = true
oxikube_kube.workspace = true
oxikube_logs_ui.workspace = true
oxikube_logging.workspace = true
oxikube_palette.workspace = true
oxikube_ports.workspace = true
oxikube_resources_ui.workspace = true
oxikube_runtime.workspace = true
oxikube_settings.workspace = true
oxikube_state_sqlite.workspace = true
oxikube_terminal.workspace = true
oxikube_theme.workspace = true
oxikube_ui.workspace = true
oxikube_workspace.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Ctrl-C under `--perf` (print the summary instead of dying silently).
tokio.workspace = true
# Screenshot support (feature `screenshot`): headless render + PNG helpers.
# Perf scenarios (feature `perf-scenarios`): headless app context.
oxikube_testkit = { workspace = true, optional = true }

# `os_motion::macos`: the OS reduce-motion preference and its change notification.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[dev-dependencies]
# `perf_window` is built by the library's tests too (its scripts run over fakes there).
oxikube_runtime = { workspace = true, features = ["perf-window"] }
# `startup` / `app_state` tests: `#[gpui::test]` over the real init order with testkit fakes.
gpui = { workspace = true, features = ["test-support"] }
# `gpui-test`: the `TestApp` harness (E05-S11) for the `app_state` harness example.
oxikube_testkit = { workspace = true, features = ["gpui-test"] }
serde_json.workspace = true
tempfile.workspace = true

[features]
default = []
# `tests/kind_app.rs`: the app against the kind cluster (`OXIKUBE_TEST_CONTEXT`). Forwards to the
# testkit helpers the test imports.
integration = ["oxikube_testkit/integration"]
# `AppState::test(cx)`: the real init order on testkit fakes, for `#[gpui::test]`s outside this crate.
test-support = ["dep:oxikube_testkit"]
# `OXIKUBE_SCREENSHOT=out.png cargo run -p oxikube --features screenshot` renders the main view
# headlessly via `Window::render_to_image` and exits. Never part of default or release builds.
screenshot = [
    "test-support",
    "dep:oxikube_testkit",
    "oxikube_testkit/gpui-screenshot",
    "gpui/test-support",
    "gpui_platform/test-support",
]
# `oxikube --perf-scenario-window <name>` runs one windowed perf scenario in the real window over
# synthetic clusters (testkit fakes for what a cluster sends; no gpui `test-support`, so the window,
# renderer and executors are the product's). Driven by `cargo xtask perf --windowed`; never part of
# default or release builds.
perf-window = ["test-support", "oxikube_runtime/perf-window"]
# `oxikube --perf-scenario <name>` runs one headless perf sample (driven by `cargo xtask perf`).
# Turns on gpui/gpui_platform `test-support` (HeadlessAppContext) through the testkit; never part
# of default or release builds.
perf-scenarios = [
    "perf-window",
    "test-support",
    "dep:oxikube_testkit",
    "oxikube_testkit/gpui-headless",
    "oxikube_runtime/perf-harness",
]

[lints]
workspace = true
