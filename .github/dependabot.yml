version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One grouped PR a week instead of one per crate, and no automatic rebase on every merge to
    # main: each rebase re-ran full CI on both OSes and queued story PRs behind it for runners.
    # Comment `@dependabot rebase` on the PR when it is ready to land.
    rebase-strategy: disabled
    groups:
      cargo:
        update-types: [minor, patch]
    ignore:
      # GPUI pins are bumped manually, all together (docs/adr/0003-gpui-dependency.md).
      - dependency-name: "gpui-pre*"
      - dependency-name: "gpui-component"
      - dependency-name: "gpui-base"
      - dependency-name: "gpui-kit-assets"
      - dependency-name: "agent-client-protocol"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    rebase-strategy: disabled
    groups:
      actions:
        patterns: ["*"]
