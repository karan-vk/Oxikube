name: setup-rust
description: >-
  Install the Rust toolchain pinned in rust-toolchain.toml (channel, components, targets), so CI
  builds with exactly the toolchain a local checkout uses, and build the GPUI patch overlay
  (ADR 0017) that the workspace's [patch.crates-io] points at, before any cargo command can run.
  Run after actions/checkout.

runs:
  using: composite
  steps:
    - name: Install the toolchain pinned in rust-toolchain.toml
      shell: bash
      # `rustup toolchain install` with no argument reads rust-toolchain.toml (rustup >= 1.28 no
      # longer installs it implicitly on the first cargo call). It is a no-op when already present.
      run: |
        rustup toolchain install --no-self-update
        rustup show active-toolchain
        rustc -vV
    - name: Build the GPUI patch overlay (scripts/gpui-overlay.sh)
      shell: bash
      # The pinned gpui-pre crates plus patches/gpui/, into .gpui-overlay/. Cargo cannot resolve
      # the workspace without it (and the cargo-deny container reads it from the workspace).
      run: bash scripts/gpui-overlay.sh
