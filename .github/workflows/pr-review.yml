name: pr-review

# Mandatory automated code review on every PR: Claude Code's `/code-review` on Sonnet 5.5.
# Runs only when the ANTHROPIC_API_KEY secret is configured (otherwise it is skipped with a
# notice, and the author/reviewer passes described in
# .claude/skills/oxikube-contributor/references/code-review.md remain the gate).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY not set; automated /code-review skipped. Author and reviewer passes are still required."
          fi

  code-review:
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Claude Code /code-review (Sonnet 5.5)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--model claude-sonnet-5-5"
          prompt: |
            /code-review high ${{ github.event.pull_request.number }} --comment
            This is the mandatory review pass for the Oxikube repository. Read
            .claude/skills/oxikube-contributor/SKILL.md and references/pr-checklist.md first.
            Post findings as inline PR comments, then leave one summary comment listing
            CONFIRMED vs PLAUSIBLE findings and whether the author's own /code-review pass
            (PR "Code review" section) was done. Do not approve or merge.
