name: integration

# kind-backed integration tests (`--features integration`) on PRs touching adapters and
# the layers/tooling they depend on. Docs-only PRs do not trigger it.
#
# The E06 smoke test (`crates/app/oxikube_app/tests/kind_smoke`, E06-S12) runs in the same job through
# the `oxikube_app/integration` feature of SUITE: two contexts, one session manager, no UI.
#
# The data plane suite (E04-S14) is `crates/adapters/oxikube_kube/tests/`; its README maps every
# port method and epic acceptance item to the test that exercises it. The nightly run executes the
# whole suite twice on the same cluster as a flake check: a test that passes once and fails once is
# a flake to fix, not to retry.
#
# The `terminal` job (E09-S13) is the terminal stack end to end on the same kind cluster: the app
# (`bins/oxikube/tests/kind_exec`, `kind_terminal`, `kind_terminal_data`) opens pod shells, debug containers and local
# shells, runs busybox `vi` and `top` through the websocket and the grid, resizes, floods, and scans
# the app's data dir for terminal content. The per-port exec, attach, node shell and debug
# scenarios (`oxikube_kube/tests/exec_*`, `oxikube_app/tests/kind_smoke/{exec,debug,node_shell}`)
# run in the `kind` job with everything else. The macOS golden screenshots of the terminal
# element are the nightly job's (`nightly.yml`).
on:
  pull_request:
    paths:
      - "crates/adapters/**"
      - "crates/ports/**"
      - "crates/app/**"
      - "crates/testing/**"
      - "crates/ui/oxikube_terminal/**"
      - "bins/oxikube/**"
      - "xtask/**"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its running suite; scheduled and manual runs queue instead.
concurrency:
  group: integration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  OXIKUBE_TEST_CONTEXT: kind-oxikube
  # A failing test's `TestNamespace` writes its events here before deleting the namespace (which
  # deletes the events); the diagnostics upload below carries them.
  OXIKUBE_TEST_DIAGNOSTICS_DIR: ${{ github.workspace }}/diagnostics/namespaces
  # kube, app and testkit integration tests; `--no-fail-fast` reports every failing file.
  SUITE: >-
    cargo test -p oxikube_kube -p oxikube_app -p oxikube_testkit
    --features oxikube_kube/integration,oxikube_app/integration,oxikube_testkit/integration
    --no-fail-fast

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: integration
          cache-on-failure: true
      - uses: helm/kind-action@v1
        with:
          cluster_name: oxikube
          wait: 120s
      # Idempotent: the cluster already exists, so this pulls every test image into the node
      # (fixtures/test-images.txt: no test waits on a registry), installs metrics-server (with
      # --kubelet-insecure-tls) and the fixtures (Widget CRD with printer columns, workloads).
      - name: Test images and cluster fixtures
        run: cargo run -q -p xtask -- kind-up --name oxikube
      # Compiled apart from the run so the test step's time is the suite's own.
      - name: Build the suite
        run: $SUITE --no-run
      - name: Integration tests
        run: $SUITE -- --nocapture
      - name: Integration tests (flake check, second run)
        if: ${{ github.event_name == 'schedule' }}
        run: $SUITE -- --nocapture
      # A failed test's namespace is deleted with its events when the test ends, so those events
      # are saved by the test itself into diagnostics/namespaces/<ns>.events.txt. This step adds
      # the cluster-wide events still present (kube-system, nodes, namespaces still running), pods,
      # nodes and the control-plane logs, so a CI failure can be read without a rerun. Events and
      # logs carry no credentials; the suite mints only short-lived service-account tokens that
      # never reach a log.
      - name: Collect cluster diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p diagnostics
          kubectl --context kind-oxikube get events -A -o wide \
            --sort-by=.metadata.creationTimestamp > diagnostics/events.txt || true
          kubectl --context kind-oxikube get pods -A -o wide > diagnostics/pods.txt || true
          kubectl --context kind-oxikube get nodes -o wide > diagnostics/nodes.txt || true
          kind export logs diagnostics/kind --name oxikube || true
      - name: Upload cluster diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Teardown
        if: always()
        run: cargo run -q -p xtask -- kind-down --name oxikube || true

  # The terminal end to end (E09-S13). Linux only: the app under test is GPUI's headless test
  # platform, so the job needs the GPUI build dependencies but no display and no GPU.
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TERMINAL_SUITE: >-
        cargo test -p oxikube --features integration --test kind_exec --test kind_terminal --test kind_terminal_data
        --no-fail-fast
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: integration-terminal
          cache-on-failure: true
      - name: Linux system dependencies (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libfreetype-dev libglib2.0-dev libssl-dev \
            libvulkan1 libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libzstd-dev libsqlite3-dev cmake clang pkg-config
      - uses: helm/kind-action@v1
        with:
          cluster_name: oxikube
          wait: 120s
      - name: Test images and cluster fixtures
        run: cargo run -q -p xtask -- kind-up --name oxikube
      # Recorded vim, less and tmux through the grid: no cluster, no GPU.
      - name: Recorded programs through the grid
        run: cargo test -p oxikube_terminal --test captures
      - name: Build the suite
        run: $TERMINAL_SUITE --no-run
      # The perf line of each run (`perf-jsonl {...}`) is kept as terminal-perf.jsonl: numbers
      # only, no terminal content.
      - name: Terminal integration tests
        run: |
          set -o pipefail
          $TERMINAL_SUITE -- --nocapture 2>&1 | tee terminal-suite.log
      - name: Terminal integration tests (flake check, second run)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -o pipefail
          $TERMINAL_SUITE -- --nocapture 2>&1 | tee -a terminal-suite.log
      - name: Collect perf records
        if: ${{ always() }}
        run: |
          mkdir -p terminal-artifacts
          sed -n 's/^perf-jsonl //p' terminal-suite.log > terminal-artifacts/terminal-perf.jsonl || true
          kubectl --context kind-oxikube get pods -A -o wide > terminal-artifacts/pods.txt || true
          kubectl --context kind-oxikube get events -A -o wide \
            --sort-by=.metadata.creationTimestamp > terminal-artifacts/events.txt || true
      # Never terminal content: the suite prints perf numbers and test names, and the artifacts
      # are those numbers plus cluster pods and events (no logs of the terminal, no scrollback).
      - name: Upload terminal artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: terminal-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Teardown
        if: always()
        run: cargo run -q -p xtask -- kind-down --name oxikube || true
