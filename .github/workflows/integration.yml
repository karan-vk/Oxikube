name: integration

# kind-backed integration tests (`--features integration`) on PRs touching adapters and
# the layers/tooling they depend on. Docs-only PRs do not trigger it.
on:
  pull_request:
    paths:
      - "crates/adapters/**"
      - "crates/ports/**"
      - "crates/app/**"
      - "crates/testing/**"
      - "xtask/**"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: helm/kind-action@v1
        with:
          cluster_name: oxikube
          wait: 120s
      # Idempotent: the cluster already exists, so this only installs metrics-server + fixtures.
      - name: Cluster fixtures
        run: cargo run -q -p xtask -- kind-up --name oxikube
      - name: Integration tests
        run: cargo test -p oxikube_kube -p oxikube_app -p oxikube_testkit --features oxikube_kube/integration,oxikube_app/integration,oxikube_testkit/integration -- --nocapture
        env:
          OXIKUBE_TEST_CONTEXT: kind-oxikube
      - name: Teardown
        if: always()
        run: cargo run -q -p xtask -- kind-down --name oxikube || true
