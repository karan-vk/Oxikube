name: integration

# kind-backed integration tests (`--features integration`) on PRs touching adapters and
# the layers/tooling they depend on. Docs-only PRs do not trigger it.
#
# The E06 smoke test (`crates/app/oxikube_app/tests/kind_smoke`, E06-S12) runs in the same job through
# the `oxikube_app/integration` feature of SUITE: two contexts, one session manager, no UI.
#
# The port-forward manager suite (E15-S09, `oxikube_app/tests/kind_smoke/portforward`) runs in the
# `kind` job too: a pod forward that answers HTTP and recovers when its pod is recreated, a
# Service forward through its EndpointSlice across pod replacement and scale to zero, an
# auto-start favourite restored over the same SQLite file, the error taxonomy and 50 concurrent
# forwards. Its timings print as `perf-jsonl {...}` lines, kept in `suite.log` with the rest of
# the output and uploaded with the diagnostics when the job fails.
#
# The Helm suite (E16-S12) runs in the `kind` job with a pinned `helm` (HELM_VERSION): the adapter's
# own kind tests (`oxikube_helm/tests/kind_native`, `kind_helm_cli`) and the app-level scenarios
# (`oxikube_app/tests/kind_smoke/helm`: releases made by the real CLI read natively with both
# storage drivers; install, upgrade, rollback and uninstall through the flows and the guard; the
# read-only block; no-binary mode; 500 releases listed natively, its time a `perf-jsonl` line, held to 1 s by a release-build
# rerun). The
# nightly `helm-minimum` job reruns the CLI scenarios with Helm 3.10, the oldest supported, to
# catch output-format drift. Charts are local; nothing is pulled from a chart repository.
#
# The data plane suite (E04-S14) is `crates/adapters/oxikube_kube/tests/`; its README maps every
# port method and epic acceptance item to the test that exercises it. The nightly run executes the
# whole suite twice on the same cluster as a flake check: a test that passes once and fails once is
# a flake to fix, not to retry.
#
# The `terminal` job (E09-S13) is the terminal stack end to end on the same kind cluster: the app
# (`bins/oxikube/tests/kind_exec`, `kind_terminal`, `kind_terminal_data`; `kind_assist`, E10-S05, reads the editor's schemas) opens pod shells, debug containers and local
# shells, runs busybox `vi` and `top` through the websocket and the grid, resizes, floods, and scans
# the app's data dir for terminal content. The manifest editor's kind suite runs there too
# (`kind_templates`, E10-S09; `kind_editor`, E10-S13: create from template, server-side apply of an
# edited Deployment, the conflict with `kubectl` and Force, CRD instance validation, the read-only
# guard), since it is the app's GPUI build as well, and so does `kind_network` (E12-S14: the default
# IngressClass moved through the bus and guard, read back from the API server), and `kind_sections`
# (E12-S20: one object of every sidebar kind seeded, each kind's table, columns, row actions,
# detail panel and guard checked in the app, a CRD's printer columns against `kubectl get`; one
# test per sidebar section, about 10 s in all), and `kind_metrics_server` (E13-S13: the Pods and Nodes
# tables, the live rings and the overview's tiles from metrics-server; the stacks are the
# nightly's `metrics-stack` job), and `kind_events` (E14-S10: a failing image pull's Warning in
# the events view within a second, the pods table's badge, the drawer's Events tab, the toast,
# mute and unmute; its service-level half, the burst counts and the `core/v1` fallback without
# `events.k8s.io`, is `oxikube_app/tests/kind_smoke/events_chain` in the `kind` job). The per-port exec, attach, node shell and debug scenarios
# (`oxikube_kube/tests/exec_*`, `oxikube_app/tests/kind_smoke/{exec,debug,node_shell}`) run in the
# `kind` job with everything else. The macOS golden screenshots of the terminal
# element are the nightly job's (`nightly.yml`).
on:
  pull_request:
    paths:
      - "crates/adapters/**"
      - "crates/ports/**"
      - "crates/app/**"
      - "crates/testing/**"
      - "crates/ui/oxikube_terminal/**"
      - "crates/ui/oxikube_editor/**"
      - "bins/oxikube/**"
      - "xtask/**"
      - ".github/workflows/integration.yml"
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its running suite; scheduled and manual runs queue instead.
concurrency:
  group: integration-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  OXIKUBE_TEST_CONTEXT: kind-oxikube
  # A failing test's `TestNamespace` writes its events and its pods' descriptions here before
  # deleting the namespace (which deletes both); the diagnostics uploads below carry them.
  OXIKUBE_TEST_DIAGNOSTICS_DIR: ${{ github.workspace }}/diagnostics/namespaces
  # kube, app and testkit integration tests; `--no-fail-fast` reports every failing file.
  SUITE: >-
    cargo test -p oxikube_kube -p oxikube_app -p oxikube_testkit -p oxikube_prometheus -p oxikube_helm
    --features oxikube_kube/integration,oxikube_app/integration,oxikube_testkit/integration,oxikube_prometheus/integration,oxikube_helm/integration
    --no-fail-fast
  # The `helm` the Helm scenarios run (E16-S12); bumped on purpose, never "latest".
  HELM_VERSION: v4.3.1

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: integration
          cache-on-failure: true
          # PRs restore main's (scheduled) cache but never save their own: ci.yml explains.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: oxikube
          wait: 120s
      # After kind-action, so this pinned binary is the `helm` on PATH the Helm suite finds.
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      # Idempotent: the cluster already exists, so this pulls every test image into the node
      # (fixtures/test-images.txt: no test waits on a registry), installs metrics-server (with
      # --kubelet-insecure-tls) and the fixtures (Widget CRD with printer columns, workloads).
      - name: Test images and cluster fixtures
        run: cargo run -q -p xtask -- kind-up --name oxikube
      # Compiled apart from the run so the test step's time is the suite's own.
      - name: Build the suite
        run: $SUITE --no-run
      - name: Integration tests
        run: |
          set -o pipefail
          mkdir -p diagnostics
          $SUITE -- --nocapture 2>&1 | tee diagnostics/suite.log
      # The epic's "500 releases listed in under 1 s" bar (E16-S12) is a release-build budget; the
      # debug SUITE above only holds the scenario to 3 s, so it runs again optimised to enforce 1 s.
      - name: Helm 500-release listing budget (release build)
        run: |
          set -o pipefail
          cargo test --release -p oxikube_app --features oxikube_app/integration --test kind_smoke \
            -- helm::scale --nocapture 2>&1 | tee -a diagnostics/suite.log
      - name: Integration tests (flake check, second run)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -o pipefail
          $SUITE -- --nocapture 2>&1 | tee -a diagnostics/suite.log
      # A failed test's namespace is deleted with its events when the test ends, so those events
      # are saved by the test itself into diagnostics/namespaces/<ns>.events.txt. This step adds
      # the cluster-wide events still present (kube-system, nodes, namespaces still running), pods,
      # nodes and the control-plane logs, so a CI failure can be read without a rerun. Events and
      # logs carry no credentials; the suite mints only short-lived service-account tokens that
      # never reach a log.
      - name: Collect cluster diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p diagnostics
          kubectl --context kind-oxikube get events -A -o wide \
            --sort-by=.metadata.creationTimestamp > diagnostics/events.txt || true
          kubectl --context kind-oxikube get pods -A -o wide > diagnostics/pods.txt || true
          kubectl --context kind-oxikube get nodes -o wide > diagnostics/nodes.txt || true
          # Helm release records (names and labels only; their payloads are not printed).
          kubectl --context kind-oxikube get secrets,configmaps -A -l owner=helm > diagnostics/helm-records.txt || true
          kind export logs diagnostics/kind --name oxikube || true
          sed -n 's/^perf-jsonl //p' diagnostics/suite.log > diagnostics/perf.jsonl || true
      - name: Upload cluster diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Teardown
        if: always()
        run: cargo run -q -p xtask -- kind-down --name oxikube || true

  # The Helm CLI scenarios against the oldest supported Helm (E16-S12), nightly and on demand: the
  # adapter's parsers and flags must still work with 3.10's output. Only the tests that run `helm`
  # (the `helm` filter); the native-only ones do not depend on the binary's version.
  helm-minimum:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HELM_SUITE: >-
        cargo test -p oxikube_helm -p oxikube_app
        --features oxikube_helm/integration,oxikube_app/integration
        --test kind_helm_cli --test kind_native --test kind_smoke
        --no-fail-fast
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: integration
          save-if: false
      - uses: helm/kind-action@v1
        with:
          cluster_name: oxikube
          wait: 120s
      - uses: azure/setup-helm@v4
        with:
          version: v3.10.3
      - name: Test images and cluster fixtures
        run: cargo run -q -p xtask -- kind-up --name oxikube
      - name: Build the suite
        run: $HELM_SUITE --no-run
      - name: Helm scenarios (Helm 3.10)
        run: |
          set -o pipefail
          mkdir -p diagnostics
          helm version | tee diagnostics/helm-version.txt
          $HELM_SUITE -- helm --nocapture 2>&1 | tee diagnostics/helm-suite.log
      - name: Collect cluster diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p diagnostics
          kubectl --context kind-oxikube get events -A -o wide \
            --sort-by=.metadata.creationTimestamp > diagnostics/events.txt || true
          kubectl --context kind-oxikube get secrets,configmaps -A -l owner=helm > diagnostics/helm-records.txt || true
      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: helm-minimum-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Teardown
        if: always()
        run: cargo run -q -p xtask -- kind-down --name oxikube || true

  # The terminal end to end (E09-S13). Linux only: the app under test is GPUI's headless test
  # platform, so the job needs the GPUI build dependencies but no display and no GPU.
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TERMINAL_SUITE: >-
        cargo test -p oxikube --features integration --test kind_exec --test kind_terminal --test kind_terminal_data --test kind_assist
        --test kind_templates --test kind_editor --test kind_network --test kind_sections
        --test kind_metrics_server --test kind_notifications --test kind_events
        --no-fail-fast
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: integration-terminal
          cache-on-failure: true
          # PRs restore main's (scheduled) cache but never save their own: ci.yml explains.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux system dependencies (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libfreetype-dev libglib2.0-dev libssl-dev \
            libvulkan1 libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libzstd-dev libsqlite3-dev cmake clang pkg-config
      - uses: helm/kind-action@v1
        with:
          cluster_name: oxikube
          wait: 120s
      - name: Test images and cluster fixtures
        run: cargo run -q -p xtask -- kind-up --name oxikube
      # Recorded vim, less and tmux through the grid: no cluster, no GPU.
      - name: Recorded programs through the grid
        run: cargo test -p oxikube_terminal --test captures
      - name: Build the suite
        run: $TERMINAL_SUITE --no-run
      # The perf line of each run (`perf-jsonl {...}`) is kept as terminal-perf.jsonl: numbers
      # only, no terminal content.
      - name: Terminal integration tests
        run: |
          set -o pipefail
          $TERMINAL_SUITE -- --nocapture 2>&1 | tee terminal-suite.log
      - name: Terminal integration tests (flake check, second run)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -o pipefail
          $TERMINAL_SUITE -- --nocapture 2>&1 | tee -a terminal-suite.log
      - name: Collect perf records
        if: ${{ always() }}
        run: |
          mkdir -p terminal-artifacts
          sed -n 's/^perf-jsonl //p' terminal-suite.log > terminal-artifacts/terminal-perf.jsonl || true
          kubectl --context kind-oxikube get pods -A -o wide > terminal-artifacts/pods.txt || true
          kubectl --context kind-oxikube get events -A -o wide \
            --sort-by=.metadata.creationTimestamp > terminal-artifacts/events.txt || true
          # A failed test's namespace events and pod descriptions (`TestNamespace` saved them).
          if [ -d diagnostics/namespaces ]; then
            cp -R diagnostics/namespaces terminal-artifacts/namespaces || true
          fi
      # Never terminal content: the suite prints perf numbers and test names, and the artifacts
      # are those numbers plus cluster pods and events, and a failed test's namespace events and
      # pod descriptions (no logs of the terminal, no scrollback).
      - name: Upload terminal artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: terminal-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: terminal-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Teardown
        if: always()
        run: cargo run -q -p xtask -- kind-down --name oxikube || true
