name: nightly

# Full matrix the PR gate skips: release builds, both OSes, rustdoc and the GPU screenshot tests
# (E01-S13), plus the perf regression gate (E01-S14). Failures open (or append to) one tracking issue
# labelled `nightly-failure`.
#
# Adding a job (later epics): add it under `jobs:`, append its id to
# `report-failure.needs`, and the failure report picks it up automatically (it lists every failed
# job in the run, not just the matrix legs).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Read-only by default; only `report-failure` gets more (see below).
permissions:
  contents: read

# One nightly at a time: a manual dispatch queues behind the scheduled run instead of racing it.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  matrix:
    name: ${{ matrix.os }} / ${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    # Cold release legs build all of GPUI; fail loudly rather than burn the 6 h default.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        profile: [dev, release]
    env:
      # Cargo profile for tests, docs and screenshots on this leg (`--profile dev` is identical to
      # cargo's default, so one flag works for every leg). Release legs use `release-fast`; the
      # shipping profile gets its own build step below.
      CARGO_PROFILE: ${{ matrix.profile == 'release' && 'release-fast' || 'dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct per profile so the dev and release legs never evict each other.
          key: ${{ matrix.profile }}
          cache-on-failure: true
      - name: Linux system dependencies (GPUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libfreetype-dev libglib2.0-dev libssl-dev \
            libvulkan1 libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libzstd-dev libsqlite3-dev cmake clang pkg-config xvfb mesa-vulkan-drivers

      # Steps below use `!cancelled()` so one broken step does not hide the others: a leg reports
      # every failing area (tests, docs, screenshots) in a single run.
      - name: Tests
        run: cargo test --workspace --profile "$CARGO_PROFILE"
      - name: Docs (warnings are errors)
        if: ${{ !cancelled() }}
        run: cargo doc --workspace --no-deps --profile "$CARGO_PROFILE"
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Screenshot tests (render_to_image)
        if: ${{ !cancelled() }}
        # Headless render needs a GPU device: Metal on macOS runners, Mesa lavapipe (software
        # Vulkan, from mesa-vulkan-drivers) on Linux. xvfb gives Linux a display for windowing init.
        run: |
          # Run every line even when one fails (the ERR trap records it and the last line fails the
          # step): one red golden must not hide the tests after it. `set +e` undoes the shell's
          # default `-e` for this script only.
          set +e
          failed=0
          trap 'failed=1' ERR
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube --features screenshot --profile "$CARGO_PROFILE"
          cargo test -p oxikube_testkit --features screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_testkit --features gpui-golden --test gpui_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_ui --features screenshot --test screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_ui --features screenshot --test theme_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_ui --features screenshot --test chart_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_workspace --features screenshot --test screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_workspace --features screenshot --test cluster_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_workspace --features screenshot --test restore_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_workspace --features screenshot --test sidebar_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_workspace --features screenshot --test notifications_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_catalog_ui --features screenshot --test screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_catalog_ui --features screenshot --test catalog_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_catalog_ui --features screenshot --test sources_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_catalog_ui --features screenshot --test cluster_tabs_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_catalog_ui --features screenshot --test connect_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_settings_ui --features screenshot --test metrics_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_overview_ui --features screenshot --test screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_events_ui --features screenshot --test screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_overview_ui --features screenshot --test overview_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_logs_ui --features screenshot --test screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_editor --features screenshot --test screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_editor --features screenshot --test diff_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_editor --features screenshot --test create_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_palette --features screenshot --test screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_palette --features screenshot --test help_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_resources_ui --features screenshot --test screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_resources_ui --features screenshot --test states_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_resources_ui --features screenshot --test overview_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_portforward_ui --features screenshot --test dialog_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_helm_ui --features screenshot --test banner_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_helm_ui --features screenshot --test install_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_helm_ui --features screenshot --test repos_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_helm_ui --features screenshot --test charts_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_helm_ui --features screenshot --test releases_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_helm_ui --features screenshot --test upgrade_screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_terminal --features screenshot --test screenshot --profile "$CARGO_PROFILE"
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube_terminal --features screenshot --test screenshot_programs --profile "$CARGO_PROFILE"
          exit $failed
      - name: Capture screenshot
        id: capture
        if: ${{ !cancelled() }}
        env:
          OXIKUBE_SCREENSHOT: ${{ github.workspace }}/screenshots/oxikube-${{ runner.os }}-${{ matrix.profile }}.png
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo run -p oxikube --features screenshot --profile "$CARGO_PROFILE"
      - name: Upload screenshot
        if: ${{ !cancelled() && steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-${{ runner.os }}-${{ matrix.profile }}
          path: screenshots/*.png
          if-no-files-found: error
      - name: Upload golden-compare failures
        # testkit writes `*.actual.png` / `*.diff.png` next to the golden when a comparison fails.
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: golden-diffs-${{ runner.os }}-${{ matrix.profile }}
          path: |
            **/tests/goldens/**/*.actual.png
            **/tests/goldens/**/*.diff.png
          if-no-files-found: ignore

      # Release legs test with `release-fast` (opt-level 3, no LTO, 16 codegen units): it still
      # catches optimiser-only failures at a fraction of the cost. The shipping profile
      # (`release`: thin LTO, 1 codegen unit) is built here to keep it compiling and linking.
      - name: Build shipping release profile
        if: ${{ !cancelled() && matrix.profile == 'release' }}
        run: cargo build --workspace --release

  # Perf regression gate (E01-S14, ADR 0013): headless scenarios on each OS, median of several
  # fresh-process samples, compared with docs/perf/baseline.json for the same runner OS. Fails above
  # +50 % on p50 and +150 % on p95/p99 (and +0.25 ms); the failure feeds `report-failure` below.
  # Blocking on Linux; advisory on macOS, whose hosted runners are too noisy to gate (see below).
  perf:
    name: perf / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: perf
          cache-on-failure: true
      - name: Linux system dependencies (GPUI)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libfreetype-dev libglib2.0-dev libssl-dev \
            libvulkan1 libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libzstd-dev libsqlite3-dev cmake clang pkg-config xvfb mesa-vulkan-drivers
      - name: Perf scenario smoke tests
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo test -p oxikube --features perf-scenarios --profile release-fast
      # Builds `oxikube --features perf-scenarios` (release-fast), runs every scenario, writes the
      # report and checks it. Headless rendering needs a GPU device: Metal on macOS, Mesa lavapipe
      # on Linux (xvfb only for windowing init, as in the screenshot step).
      #
      # Hosted runners swing between jobs with no code change (`macos-latest` moved p50 +20 to +90 %
      # and p95/p99 up to +280 % across nightlies of the same code), so the tolerances are loose
      # (+50 % p50, +150 % tails; the local default is +20 %), a failed check is repeated once with
      # fresh processes, and on macOS the result is advisory: the report is still uploaded and a
      # warning annotation says so. Rationale and numbers: docs/PERFORMANCE.md (E01-F542).
      - name: cargo xtask perf --all --check
        id: perf
        # A macOS regression is read from the annotation and the uploaded report, not from a red job.
        continue-on-error: ${{ runner.os == 'macOS' }}
        shell: bash
        run: |
          perf_check() {
            ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} cargo xtask perf --all --check --samples 7 --tolerance 0.5 --tail-tolerance 1.5 \
              --out perf/report-${{ runner.os }}.json
          }
          if ! perf_check; then
            echo "::warning::perf check failed; repeating once to rule out runner noise"
            perf_check
          fi
      - name: Perf check is advisory on macOS
        if: ${{ runner.os == 'macOS' && steps.perf.outcome == 'failure' }}
        run: echo "::warning title=macOS perf check failed (advisory)::Hosted macOS runners are too noisy to gate on; compare the uploaded perf-report-macOS artifact with docs/perf/baseline.json before trusting a regression."
      - name: Upload perf report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: perf-report-${{ runner.os }}
          path: perf/report-*.json
          if-no-files-found: warn

  # The metrics path against real stacks (E13-S13, ADR 0011): kind with the pinned metrics-server
  # (`kind-up`), then the pinned kube-prometheus-stack and VictoriaMetrics single-node
  # (`cargo xtask kind-metrics-stack`, charts and versions in
  # crates/testing/oxikube_testkit/fixtures/metrics-stack/charts.json). The stacks are test fixtures
  # in this throwaway cluster only: Oxikube never installs a metrics stack into a user's cluster.
  #   tier 1, metrics-server: the adapter, the live service and its rings, the Pods and Nodes
  #     tables, the overview's tiles, and the absent case (`metrics unavailable: <reason>`);
  #   tier 2, the stacks: auto-detection and classification of kube-prometheus, the detail panels'
  #     and the overview's graphs, VictoriaMetrics as a manual endpoint under a path prefix.
  # Waits retry readiness only (a scrape landing), never an assertion; an assertion names its PromQL.
  # A failure uploads the suites' output, the stacks' pods, events and logs, and the kind logs.
  metrics-stack:
    name: metrics stack (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OXIKUBE_TEST_CONTEXT: kind-oxikube
      OXIKUBE_TEST_PROMETHEUS_STACK: "1"
      OXIKUBE_TEST_VICTORIA_METRICS: "1"
      OXIKUBE_TEST_DIAGNOSTICS_DIR: ${{ github.workspace }}/metrics-artifacts/namespaces
      # The adapters and the app services on metrics-server and the stacks (no UI).
      CORE_SUITE: >-
        cargo test -p oxikube_kube -p oxikube_prometheus
        --features oxikube_kube/integration,oxikube_prometheus/integration
        --test metrics_kind --test kind_prometheus --test kind_catalogue --no-fail-fast
      APP_SUITE: >-
        cargo test -p oxikube_app --features integration --test kind_smoke --no-fail-fast
      # The app end to end, headless: tables, overview, detection, graphs, manual endpoint.
      UI_SUITE: >-
        cargo test -p oxikube --features integration
        --test kind_metrics_server --test kind_metrics_stack --test kind_metrics --test kind_allocation
        --no-fail-fast
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: metrics-stack
          cache-on-failure: true
      - name: Linux system dependencies (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libfontconfig-dev libfreetype-dev libglib2.0-dev libssl-dev \
            libvulkan1 libvulkan-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libzstd-dev libsqlite3-dev cmake clang pkg-config
      - uses: helm/kind-action@v1
        with:
          cluster_name: oxikube
          wait: 120s
      # Built while nothing else runs, so the test steps' time is the suites' own.
      - name: Build the suites
        run: |
          $CORE_SUITE --no-run
          $APP_SUITE --no-run
          $UI_SUITE --no-run
      - name: Test images, metrics-server and fixtures
        run: cargo run -q -p xtask -- kind-up --name oxikube
      - name: Metrics stack (pinned charts)
        timeout-minutes: 15
        run: |
          mkdir -p metrics-artifacts
          helm version | tee metrics-artifacts/versions.txt
          set -o pipefail
          cargo run -q -p xtask -- kind-metrics-stack --name oxikube 2>&1 | tee -a metrics-artifacts/versions.txt
      - name: Metrics suite (adapters)
        timeout-minutes: 15
        run: |
          set -o pipefail
          $CORE_SUITE -- --nocapture 2>&1 | tee metrics-artifacts/core-suite.log
      - name: Metrics suite (app services)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          set -o pipefail
          $APP_SUITE -- metrics --nocapture 2>&1 | tee metrics-artifacts/app-suite.log
      - name: Metrics suite (the app, headless)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          set -o pipefail
          $UI_SUITE -- --nocapture 2>&1 | tee metrics-artifacts/ui-suite.log
      # Status, events and the stacks' own logs: no credentials (the suites mint none here) and no
      # object payloads.
      - name: Collect metrics diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p metrics-artifacts
          kubectl --context kind-oxikube get pods -A -o wide > metrics-artifacts/pods.txt || true
          kubectl --context kind-oxikube get events -A -o wide \
            --sort-by=.metadata.creationTimestamp > metrics-artifacts/events.txt || true
          kubectl --context kind-oxikube get apiservice v1beta1.metrics.k8s.io -o yaml \
            > metrics-artifacts/metrics-apiservice.yaml || true
          for ns in monitoring oxikube-vm; do
            for pod in $(kubectl --context kind-oxikube -n "$ns" get pods -o name); do
              kubectl --context kind-oxikube -n "$ns" logs "$pod" --all-containers --tail=300 \
                > "metrics-artifacts/logs-$ns-${pod#pod/}.txt" 2>&1 || true
            done
          done
          kubectl --context kind-oxikube -n kube-system logs deployment/metrics-server --tail=300 \
            > metrics-artifacts/logs-metrics-server.txt 2>&1 || true
          kind export logs metrics-artifacts/kind --name oxikube || true
      - name: Upload metrics artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: metrics-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: metrics-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Teardown
        if: always()
        run: cargo run -q -p xtask -- kind-down --name oxikube || true

  report-failure:
    name: report failure
    needs: [matrix, perf, metrics-stack]
    # Only real failures (a leg timing out counts as a failure). A cancelled run is a person
    # stopping it, which is not a regression to report. Green runs skip this job entirely.
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write to the tracker; `actions: read` is for listing the run's jobs.
    permissions:
      actions: read
      issues: write
    # Two overlapping runs must not both decide "no open issue" and create duplicates.
    concurrency:
      group: nightly-failure-report
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      LABEL: nightly-failure
    steps:
      - name: Open or append to the nightly-failure issue
        shell: bash
        run: |
          set -euo pipefail

          # Every job in this run that did not succeed (this job is still running, so it is not
          # listed as failed). Each line: "<job name> (<failed step>)".
          failed=$(gh api --paginate "repos/${GH_REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" \
            --jq '.jobs[]
              | select(.conclusion == "failure" or .conclusion == "timed_out")
              | "- `\(.name)`: " + (([.steps[]? | select(.conclusion == "failure") | .name] | first) // "job failed or timed out")')
          if [ -z "${failed}" ]; then
            failed="- (could not determine failing legs; see the run)"
          fi

          body=$(printf 'Nightly run failed: %s\n\nFailing legs:\n%s\n' "${RUN_URL}" "${failed}")

          # Label may not exist yet (fresh repo, or someone deleted it).
          if ! gh api "repos/${GH_REPO}/labels/${LABEL}" --silent 2>/dev/null; then
            gh label create "${LABEL}" --color B60205 \
              --description "Tracks failing nightly runs. Close it once fixed; the next failure opens a new one."
          fi

          existing=$(gh issue list --label "${LABEL}" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            echo "Commented on #${existing}"
          else
            title="Nightly failure: $(date -u +%Y-%m-%d)"
            url=$(gh issue create --title "${title}" --label "${LABEL}" \
              --body "${body}"$'\n\nLater failing nightlies are added to this issue as comments. Close it once the cause is fixed.')
            echo "Created ${url}"
          fi
