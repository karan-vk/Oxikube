[package]
name = "oxikube_app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Use-cases and services (no gpui, no kube): ClusterSessionManager, ResourceStore, CommandBus, MutationGuard + AuditService, LogService, ExecService, PortForwardManager, EventService, NotificationService, MetricsService, HelmService, DescribeService, SearchService, IntegrationRegistry, ToolRegistry, ContextRegistry, AgentSessionManager, ApplyService."

[lib]
path = "src/oxikube_app.rs"
doctest = false

[dependencies]
async-trait.workspace = true
# `Bytes` in `BackendEvent::Output` (the notice line of a terminal).
bytes.workspace = true
# The CA in a generated kubeconfig is embedded base64 (`sa_kubeconfig`, E17-S09).
base64.workspace = true
futures.workspace = true
indexmap.workspace = true
jiff.workspace = true
# The fuzzy ranking engine (`search::fuzzy`, E11-S11): one `Matcher` pool for every surface.
nucleo-matcher.workspace = true
oxikube_domain.workspace = true
oxikube_ports.workspace = true
parking_lot.workspace = true
# The `/` filter's name patterns (E07-S04): compiled once per edit, linear-time matching.
regex.workspace = true
serde.workspace = true
# Tool stub input schemas (`ToolDef::input_schema`) and command output data.
serde_json.workspace = true
# `helm::Rollback`'s preview: the line diff of two revisions' values (E16-S06).
similar.workspace = true
# A TLS Secret's certificate (E12-S11): subject, validity, names.
x509-parser.workspace = true
# `resource::Apply` (E10-S08) reads a manifest written in YAML (or JSON) as one object.
serde-saphyr.workspace = true
thiserror.workspace = true
# `tokio::sync::broadcast` (the session update stream) and one spawned task per connected session:
# the forwarder of the adapter's kind events (`session::kinds`, E03-F544).
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
# Grapheme clusters: nucleo counts matched characters in them (`search::fuzzy`).
unicode-segmentation.workspace = true

[dev-dependencies]
oxikube_testkit.workspace = true
# `#[tokio::test(start_paused = true)]` for the exec shell probe's timeout.
tokio = { workspace = true, features = ["test-util"] }
proptest.workspace = true
# The kind smoke test (`tests/kind_smoke`, E06-S12) runs the app services over the real adapter.
# Dev-dependencies are exempt from `lint-deps`; the production graph stays free of adapters.
jiff.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
oxikube_kube.workspace = true
# The Helm suite (`tests/kind_smoke/helm`, E16-S12): the real `helm` CLI adapter and the native reader.
oxikube_helm.workspace = true
# `kind_smoke::metrics_absent` (E13-S13): a client layer that hides `metrics.k8s.io` from the adapter.
http.workspace = true
tower.workspace = true
# The recents survive a restart of the real SQLite adapter (`tests/recents_sqlite.rs`, E11-S11).
oxikube_state_sqlite.workspace = true
tempfile.workspace = true
# Self-signed certificates for the Secret tests (made at run time; no key material in the repository).
rcgen.workspace = true

# `cargo bench -p oxikube_app --bench store_apply` (E07-S01): a 500-event batch into a 10k cache.
[[bench]]
name = "store_apply"
harness = false

# `cargo bench -p oxikube_app --bench node_loads` (E12-S09): what the pods-by-node index adds per pod delta.
[[bench]]
name = "node_loads"
harness = false

# `cargo bench -p oxikube_app --bench store_filter` (E07-S04): typing a filter over 10k rows.
[[bench]]
name = "store_filter"
harness = false

# `cargo bench -p oxikube_app --bench column_cell` (E07-S02): the per-cell cost of `ColumnProvider`.
[[bench]]
name = "column_cell"
harness = false

# `cargo bench -p oxikube_app --bench utilisation` (E13-S02): requests/limits/percent maths, 10k-pod allocation.
[[bench]]
name = "utilisation"
harness = false

# `cargo bench -p oxikube_app --bench live_metrics` (E13-S03): a 10k-pod metrics poll and a usage cell.
[[bench]]
name = "live_metrics"
harness = false

# `cargo bench -p oxikube_app --bench cluster_overview` (E13-S09): the overview feed's tally, distribution and top-N.
[[bench]]
name = "cluster_overview"
harness = false

# `cargo bench -p oxikube_app --bench log_ingest` (E08-S01): lines through a LogService session.
[[bench]]
name = "log_ingest"
harness = false

# `cargo bench -p oxikube_app --bench log_search` (E08-S03): the match index over a full ring buffer.
[[bench]]
name = "log_search"
# `cargo bench -p oxikube_app --bench log_merge` (E08-S04): many pods merged into one ring.
[[bench]]
name = "log_merge"
harness = false

[features]
default = []
# Enables tests that need a live kind cluster (`cargo xtask kind-up`; OXIKUBE_TEST_CONTEXT).
# Forwards to the testkit helpers (a dev-dependency) that the integration tests import.
integration = ["oxikube_testkit/integration"]

[lints]
workspace = true

# `cargo bench -p oxikube_app --bench log_parse` (E08-S05): JSON structured-line parse throughput.
[[bench]]
name = "log_parse"
harness = false

# `cargo bench -p oxikube_app --bench command_list` (E11-S01): `CommandBus::list` over 2 000 commands.
[[bench]]
name = "command_list"
harness = false

# `cargo bench -p oxikube_app --bench alias_resolve` (E11-S04): a jump-bar lookup and a table rebuild.
[[bench]]
name = "alias_resolve"
harness = false

# `cargo bench -p oxikube_app --bench fuzzy_rank` (E11-S11): ranking 2 000 command titles per keystroke.
[[bench]]
name = "fuzzy_rank"
harness = false

# `cargo bench -p oxikube_app --bench event_buffer` (E14-S02): 10k inserts (budget 50 ms) and a full buffer's memory.
[[bench]]
name = "event_buffer"
harness = false

# `cargo bench -p oxikube_app --bench reference_index` (E12-S18): the "used by" reference index over 10k pods.
[[bench]]
name = "reference_index"
harness = false

# `cargo bench -p oxikube_app --bench rbac_matrix` (E17 audit): SubjectIndex queries behind the RBAC matrix, 12k objects.
[[bench]]
name = "rbac_matrix"
harness = false
