[package]
name = "oxikube_app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Use-cases and services (no gpui, no kube): ClusterSessionManager, ResourceStore, CommandBus, MutationGuard + AuditService, LogService, ExecService, PortForwardManager, EventService, NotificationService, MetricsService, HelmService, DescribeService, SearchService, IntegrationRegistry, ToolRegistry, ContextRegistry, AgentSessionManager, ApplyService."

[lib]
path = "src/oxikube_app.rs"
doctest = false

[dependencies]
futures.workspace = true
indexmap.workspace = true
jiff.workspace = true
oxikube_domain.workspace = true
oxikube_ports.workspace = true
parking_lot.workspace = true
serde.workspace = true
# Tool stub input schemas (`ToolDef::input_schema`) and command output data.
serde_json.workspace = true
thiserror.workspace = true
# `tokio::sync::broadcast` only (the session update stream); runtime-agnostic, no task is spawned.
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
oxikube_testkit.workspace = true
proptest.workspace = true
# The kind smoke test (`tests/kind_smoke`, E06-S12) runs the app services over the real adapter.
# Dev-dependencies are exempt from `lint-deps`; the production graph stays free of adapters.
jiff.workspace = true
k8s-openapi.workspace = true
kube.workspace = true
oxikube_kube.workspace = true

[features]
default = []
# Enables tests that need a live kind cluster (`cargo xtask kind-up`; OXIKUBE_TEST_CONTEXT).
# Forwards to the testkit helpers (a dev-dependency) that the integration tests import.
integration = ["oxikube_testkit/integration"]

[lints]
workspace = true
