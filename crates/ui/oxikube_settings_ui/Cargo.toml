[package]
name = "oxikube_settings_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "GUI settings page, keymap editor, theme picker."

[lib]
path = "src/oxikube_settings_ui.rs"
doctest = false

[dependencies]
futures.workspace = true
gpui.workspace = true
jiff.workspace = true
oxikube_app.workspace = true
oxikube_domain.workspace = true
oxikube_helm_ui.workspace = true
oxikube_ports.workspace = true
oxikube_ui.workspace = true
oxikube_workspace.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
oxikube_keymap.workspace = true
oxikube_runtime.workspace = true
oxikube_testkit = { workspace = true, features = ["gpui-screenshot"] }
oxikube_workspace = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt"] }

[features]
default = []
# `metrics::test_support`: a scripted backend and sample statuses, for the `#[gpui::test]`s of this
# crate and of the crates that mount the page.
test-support = []
# Headless GPU screenshots (`tests/metrics_screenshot.rs`; harness = false so it runs on the process
# main thread). Needs Metal / Vulkan, so never part of the default gate; the nightly workflow runs
# it: `cargo test -p oxikube_settings_ui --features screenshot --test metrics_screenshot`.
screenshot = ["test-support"]

[[test]]
name = "metrics_screenshot"
path = "tests/metrics_screenshot.rs"
harness = false
required-features = ["screenshot"]

[lints]
workspace = true
