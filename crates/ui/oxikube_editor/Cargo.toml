[package]
name = "oxikube_editor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Manifest editor: YAML/JSON on gpui-component editor, spanned YAML (granit-parser), OpenAPI schema validation, hover/completion, diff vs live, dry-run + SSA apply, templates."

[lib]
path = "src/oxikube_editor.rs"
doctest = false

[dependencies]
futures.workspace = true
gpui.workspace = true
# Spanned YAML 1.2 events for `yaml` (E10-S02); confined to `yaml/parse.rs`.
granit-parser.workspace = true
# `view` (E10-S04): the session manager (schemas), the command bus registry.
oxikube_app.workspace = true
oxikube_keymap.workspace = true
# The "Create resource" picker (E10-S09) is a `Picker` (E11-S02).
oxikube_palette.workspace = true
oxikube_ports.workspace = true
# Schema fetches on the Kubernetes runtime (`spawn_kube`).
oxikube_runtime.workspace = true
# The `editor` settings (E10-S12).
oxikube_settings.workspace = true
oxikube_ui.workspace = true
oxikube_workspace.workspace = true
tracing.workspace = true
# `Gvk` of a document (schema lookup) and `JsonSchema` for `validate` (E10-S03).
oxikube_domain.workspace = true
# Schema `pattern` checks (RE2-compatible syntax, which is what Kubernetes patterns use).
regex.workspace = true
schemars.workspace = true
serde.workspace = true
# Schema `enum` values are JSON.
serde_json.workspace = true
# `open::render_resource` writes the object as YAML (the repo's writer, not serde_yml); `diff` (E10-S07)
# reads the buffer as values and writes both sides with it.
serde-saphyr.workspace = true
# `diff` (E10-S07): line diffs and the three-way merge.
similar.workspace = true

[dev-dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
insta.workspace = true
oxikube_assets.workspace = true
oxikube_testkit = { workspace = true, features = ["gpui-screenshot"] }
oxikube_workspace = { workspace = true, features = ["test-support"] }
parking_lot.workspace = true
proptest.workspace = true
# Captures what the apply of a decoded Secret logs (E12-S11): no value among it.
tracing-subscriber.workspace = true
# An independent YAML reader to check that what the writer emits reads back as the same data.
serde-saphyr.workspace = true

[features]
default = []
# Headless GPU screenshot of the editor (`tests/screenshot.rs`, harness = false so it runs on the
# process main thread). Needs Metal / Vulkan, so never part of the default gate; the nightly
# workflow runs it: `cargo test -p oxikube_editor --features screenshot --test screenshot`.
screenshot = []

[[test]]
name = "screenshot"
path = "tests/screenshot.rs"
harness = false
required-features = ["screenshot"]

# Diff vs live (E10-S07): the changed-on-server banner, the diff side by side and inline.
# `cargo test -p oxikube_editor --features screenshot --test diff_screenshot`
[[test]]
name = "diff_screenshot"
path = "tests/diff_screenshot.rs"
harness = false
required-features = ["screenshot"]

# The cross-cluster resource diff (E20-S09): the summary above the side-by-side line diff, a
# Secret without values, a missing side.
# `cargo test -p oxikube_editor --features screenshot --test resource_diff_screenshot`
[[test]]
name = "resource_diff_screenshot"
path = "tests/resource_diff_screenshot.rs"
harness = false
required-features = ["screenshot"]

# Create from template and multi-document apply (E10-S09): the "Create resource" picker and the
# combined preview of several documents.
# `cargo test -p oxikube_editor --features screenshot --test create_screenshot`
[[test]]
name = "create_screenshot"
path = "tests/create_screenshot.rs"
harness = false
required-features = ["screenshot"]

# The guard's dry run in the confirmation dialog (E19-S07): the diff of a previewed patch with a
# server warning, and the banner of an API that cannot dry-run.
# `cargo test -p oxikube_editor --features screenshot --test dry_run_screenshot`
[[test]]
name = "dry_run_screenshot"
path = "tests/dry_run_screenshot.rs"
harness = false
required-features = ["screenshot"]

# `cargo bench -p oxikube_editor --bench yaml_parse` (E10-S02, reused by E10-S11): parse time of a
# 2k-line manifest and a 5 MB dump.
[[bench]]
name = "yaml_parse"
harness = false

# `cargo bench -p oxikube_editor --bench validate` (E10-S03): schema validation of a 2k-line
# Deployment manifest (budget 50 ms, epic goal squiggles within 100 ms of typing).
[[bench]]
name = "validate"
harness = false

# `cargo bench -p oxikube_editor --bench convert` (E10-S10): YAML to JSON and back, and the strict
# JSON check, on a 2k-line manifest and a 5 MB dump (all of it off the UI thread in the editor).
[[bench]]
name = "convert"
# `cargo bench -p oxikube_editor --bench assist` (E10-S05): hover and completion on a 2k-line Pod
# and a 5 MB one.
[[bench]]
name = "assist"
harness = false

# Keystroke-to-frame cost of typing in a 2 000-line manifest, and the validation it debounces
# (test platform): `cargo run -p oxikube_editor --profile release-fast --example typing_bench`
[[example]]
name = "typing_bench"

# Typing in a Deployment tab whose live object changes every second, the diff open (E10-S07):
# `cargo run -p oxikube_editor --profile release-fast --example live_bench`
[[example]]
name = "live_bench"

# Building the embedded templates and filling the namespace in (E10-S09):
# `cargo run -p oxikube_editor --profile release-fast --example templates_bench`
[[example]]
name = "templates_bench"

[lints]
workspace = true
