[package]
name = "oxikube_resources_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Generic resource table + detail drawer, per-kind panels and actions, create/bulk ops, CRD browsing, apply UI, file browser, audit viewer."

[lib]
path = "src/oxikube_resources_ui.rs"
doctest = false

[dependencies]
futures.workspace = true
gpui.workspace = true
jiff.workspace = true
oxikube_app.workspace = true
oxikube_domain.workspace = true
oxikube_keymap.workspace = true
oxikube_palette.workspace = true
oxikube_ports.workspace = true
oxikube_runtime.workspace = true
oxikube_settings.workspace = true
oxikube_theme.workspace = true
oxikube_ui.workspace = true
oxikube_workspace.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
insta.workspace = true
serde-saphyr.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
oxikube_testkit = { workspace = true, features = ["gpui-screenshot"] }
oxikube_workspace = { workspace = true, features = ["test-support"] }

[features]
default = []
# Headless GPU screenshot of a pods table with every status tone (`tests/screenshot.rs`,
# harness = false so it runs on the process main thread). Needs Metal / Vulkan, so never part of
# the default gate; the nightly workflow runs it:
# `cargo test -p oxikube_resources_ui --features screenshot --test screenshot`.
screenshot = []

[[test]]
name = "screenshot"
path = "tests/screenshot.rs"
harness = false
required-features = ["screenshot"]

# The table's states (loading, empty, forbidden, unauthorized, error, stale rows), E07-S10.
[[test]]
name = "states_screenshot"
path = "tests/states_screenshot.rs"
harness = false
required-features = ["screenshot"]

[lints]
workspace = true
