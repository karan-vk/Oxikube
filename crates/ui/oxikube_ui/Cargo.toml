[package]
name = "oxikube_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Thin wrapper over gpui-component: tokens, curated components (Table, DockArea, Dialog, Menu, Input, Tabs, Sidebar, Charts, Markdown, Editor glue), icons, zoom-safe sizes. The ONLY crate allowed to import gpui_component."

[lib]
path = "src/oxikube_ui.rs"
doctest = false

[dependencies]
# The error type of gpui-component's completion and hover provider traits (`editor::assist`).
anyhow.workspace = true
gpui.workspace = true
# `tree-sitter-yaml`: the YAML grammar of the read-only code view (`editor`), E07-S06. The JSON
# grammar of the manifest editor's JSON mode (E10-S10) has no feature of its own: tree-sitter-json
# is part of gpui-component's base `tree-sitter` feature (`tests/code_editor.rs` checks it).
gpui-component = { workspace = true, features = ["tree-sitter-yaml"] }
gpui-kit-assets.workspace = true
# Time-axis labels: a fixed-offset zone formats the ticks of `chart` (and its system offset).
jiff.workspace = true
# Hover and completion payloads of the library's editor (E10-S05); confined to `editor::assist`.
lsp-types.workspace = true
oxikube_assets.workspace = true
oxikube_theme.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
oxikube_testkit = { workspace = true, features = ["gpui-screenshot"] }
gpui_platform = { workspace = true, features = ["test-support"] }
anyhow.workspace = true

[features]
default = []
# Headless GPU screenshot test of the token sampler (`tests/screenshot.rs`, harness = false so it
# runs on the process main thread). Needs Metal / Vulkan, so never part of the default gate; the
# nightly workflow runs it: `cargo test -p oxikube_ui --features screenshot`.
screenshot = []

[[test]]
name = "screenshot"
path = "tests/screenshot.rs"
harness = false
required-features = ["screenshot"]

# The same sample under two themes (E05-S08); same requirements as `screenshot`.
[[test]]
name = "theme_screenshot"
path = "tests/theme_screenshot.rs"
harness = false
required-features = ["screenshot"]

# Line, area, bar, sparkline and gallery pictures under two themes (E13-S07); same requirements.
[[test]]
name = "chart_screenshot"
path = "tests/chart_screenshot.rs"
harness = false
required-features = ["screenshot"]

[lints]
workspace = true
