[package]
name = "oxikube_catalog_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Cluster catalog home, hotbar, kubeconfig sources management, cloud discovery UI, connect lifecycle, namespace selector."

[lib]
path = "src/oxikube_catalog_ui.rs"
doctest = false

[dependencies]
async-trait.workspace = true
futures.workspace = true
gpui.workspace = true
indexmap.workspace = true
jiff.workspace = true
nucleo-matcher.workspace = true
parking_lot.workspace = true
oxikube_app.workspace = true
oxikube_domain.workspace = true
oxikube_keymap.workspace = true
oxikube_ports.workspace = true
oxikube_runtime.workspace = true
oxikube_settings.workspace = true
oxikube_ui.workspace = true
oxikube_workspace.workspace = true
schemars.workspace = true
serde.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
oxikube_testkit = { workspace = true, features = ["gpui-screenshot"] }
oxikube_workspace = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true

[features]
default = []
# `test_support`: a recording command dispatcher and synthetic catalog entries, for the
# `#[gpui::test]`s of this crate and of the crates built on the catalog.
test-support = []
# Headless GPU screenshots (`tests/screenshot.rs` for the namespace selector,
# `tests/catalog_screenshot.rs` for the catalog, `tests/cluster_tabs_screenshot.rs` for the hotbar
# and cluster tabs, `tests/sources_screenshot.rs` for the sources screen, `tests/connect_screenshot.rs` for the
# connect lifecycle; harness = false so they run on the process main
# thread). Need Metal / Vulkan, so never part of the default gate; the nightly workflow runs them:
# `cargo test -p oxikube_catalog_ui --features screenshot --test screenshot --test catalog_screenshot --test cluster_tabs_screenshot --test sources_screenshot --test connect_screenshot`.
screenshot = ["test-support"]

[[test]]
name = "screenshot"
path = "tests/screenshot.rs"
harness = false
required-features = ["screenshot"]

[[test]]
name = "catalog_screenshot"
path = "tests/catalog_screenshot.rs"
harness = false
required-features = ["screenshot"]

[[test]]
name = "cluster_tabs_screenshot"
path = "tests/cluster_tabs_screenshot.rs"
harness = false
required-features = ["screenshot"]

[[test]]
name = "sources_screenshot"
path = "tests/sources_screenshot.rs"
harness = false
required-features = ["screenshot"]

[[test]]
name = "connect_screenshot"
path = "tests/connect_screenshot.rs"
harness = false
required-features = ["screenshot"]

# Cost of the selector's local work: `cargo run -p oxikube_catalog_ui --profile release-fast --example namespace_bench`
[[example]]
name = "namespace_bench"

# First paint, search keystroke and redraw cost on the test platform:
# `cargo run -p oxikube_catalog_ui --features test-support --profile release-fast --example catalog_bench`
[[example]]
name = "catalog_bench"
required-features = ["test-support"]

[lints]
workspace = true
