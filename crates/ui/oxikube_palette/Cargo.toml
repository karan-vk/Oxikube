[package]
name = "oxikube_palette"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Command palette, ':' jump bar, pickers (vendored Zed PickerDelegate design), help overlay."

[lib]
path = "src/oxikube_palette.rs"
doctest = false

[dependencies]
futures.workspace = true
gpui.workspace = true
oxikube_app.workspace = true
oxikube_domain.workspace = true
oxikube_keymap.workspace = true
oxikube_runtime.workspace = true
oxikube_ui.workspace = true
oxikube_workspace.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
oxikube_assets.workspace = true
oxikube_ports.workspace = true
parking_lot.workspace = true
serde_json.workspace = true
oxikube_testkit = { workspace = true, features = ["gpui-screenshot"] }
oxikube_workspace = { workspace = true, features = ["test-support"] }

[features]
default = []
# `picker::test_support`: a delegate over a list of strings that records what the picker asked
# of it, for the `#[gpui::test]`s, the screenshot test and the bench.
test-support = []
# Headless GPU screenshots of the picker (`tests/screenshot.rs`, harness = false so it runs on the
# process main thread). Needs Metal / Vulkan, so never part of the default gate; the nightly
# workflow runs it: `cargo test -p oxikube_palette --features screenshot --test screenshot`.
screenshot = ["test-support"]

[[test]]
name = "screenshot"
path = "tests/screenshot.rs"
harness = false
required-features = ["screenshot"]

# Headless GPU screenshots of the help overlay (E11-S10): the same job as above.
[[test]]
name = "help_screenshot"
path = "tests/help_screenshot.rs"
harness = false
required-features = ["screenshot"]

# Open, keystroke-to-matches and redraw cost of a 2 000-entry picker on the test platform:
# `cargo run -p oxikube_palette --features test-support --profile release-fast --example picker_bench`
[[example]]
name = "picker_bench"
required-features = ["test-support"]

# The same for the command palette over 2 000 commands (classify, open, keystroke, redraw):
# `cargo run -p oxikube_palette --features test-support --profile release-fast --example command_palette_bench`
[[example]]
name = "command_palette_bench"
required-features = ["test-support"]

# Open, keystroke-to-matches, parse/plan and redraw cost of the `:` jump bar over about 2 400 alias
# names on the test platform:
# `cargo run -p oxikube_palette --features test-support --profile release-fast --example jump_bench`
[[example]]
name = "jump_bench"
required-features = ["test-support"]

# Resolving the focused view's bindings, opening the help overlay and a keystroke in its search
# field, over the shipped keymap and over a 2 000-binding one:
# `cargo run -p oxikube_palette --features test-support --profile release-fast --example help_bench`
[[example]]
name = "help_bench"
required-features = ["test-support"]

[lints]
workspace = true
