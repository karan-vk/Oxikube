[package]
name = "oxikube_rbac_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "RBAC views (SA, roles, bindings), subject-centric matrices, can-i, SA kubeconfig generation."

[lib]
path = "src/oxikube_rbac_ui.rs"
doctest = false

[dependencies]
futures.workspace = true
gpui.workspace = true
oxikube_app.workspace = true
oxikube_domain.workspace = true
oxikube_keymap.workspace = true
oxikube_resources_ui.workspace = true
# `spawn_kube` (the review and the subject feed pump, aborted on drop) and `notify_coalesced`.
oxikube_runtime.workspace = true
oxikube_ui.workspace = true
oxikube_workspace.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
futures.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
oxikube_assets.workspace = true
oxikube_ports.workspace = true
oxikube_testkit = { workspace = true, features = ["gpui-test", "gpui-screenshot"] }
serde_json.workspace = true
oxikube_workspace = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

[features]
default = []
# Headless GPU screenshots (`tests/panel_screenshot.rs`, `tests/subjects_screenshot.rs`, harness =
# false so they run on the process main thread). Need Metal / Vulkan, so never part of the default
# gate; the nightly workflow runs them: `cargo test -p oxikube_rbac_ui --features screenshot --test <name>`.
screenshot = []

[[test]]
name = "subjects_screenshot"
path = "tests/subjects_screenshot.rs"
harness = false
required-features = ["screenshot"]

[[test]]
name = "panel_screenshot"
path = "tests/panel_screenshot.rs"
harness = false
required-features = ["screenshot"]
