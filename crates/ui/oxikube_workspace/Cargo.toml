[package]
name = "oxikube_workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Window shell: Item/Panel/Pane/Dock model, tabs, status bar, modal/toast layers, layout persistence, cluster tabs, sidebar, notifications panel."

[lib]
path = "src/oxikube_workspace.rs"
doctest = false

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
indexmap.workspace = true
oxikube_app.workspace = true
oxikube_domain.workspace = true
oxikube_ports.workspace = true
oxikube_runtime.workspace = true
oxikube_settings.workspace = true
oxikube_ui.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
async-trait.workspace = true
oxikube_keymap.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
oxikube_state_sqlite.workspace = true
oxikube_testkit = { workspace = true, features = ["gpui-screenshot"] }
parking_lot.workspace = true
tempfile.workspace = true
# A current-thread runtime the sidebar tests connect on, so the session's kind forwarder runs.
tokio = { workspace = true, features = ["rt"] }

[features]
default = []
# `test_support`: a test item and a test panel for `#[gpui::test]`s in this crate and in the crates
# that build on the workspace (layout persistence, status bar, cluster tabs).
test-support = ["gpui/test-support"]
# Headless GPU screenshot of a populated workspace (`tests/screenshot.rs`, harness = false so it runs
# on the process main thread). Needs Metal / Vulkan, so never part of the default gate; the nightly
# workflow runs it: `cargo test -p oxikube_workspace --features screenshot --test screenshot`.
screenshot = ["test-support"]

[[test]]
name = "screenshot"
path = "tests/screenshot.rs"
harness = false
required-features = ["screenshot"]

# The production preset's badges in light and dark (E06-S09); same harness and gate as above.
[[test]]
name = "cluster_screenshot"
path = "tests/cluster_screenshot.rs"
harness = false
required-features = ["screenshot"]

# Session restore: placeholder tabs and a failed cluster's tab (E06-S11); same harness and gate.
[[test]]
name = "restore_screenshot"
path = "tests/restore_screenshot.rs"
harness = false
required-features = ["screenshot"]

# The cluster sidebar for an admin and a restricted user, light and dark (E06-S10); same gate.
[[test]]
name = "sidebar_screenshot"
path = "tests/sidebar_screenshot.rs"
harness = false
required-features = ["screenshot"]

# Frame cost of a dock resize and a tab switch with a heavy item mounted (test platform):
# `cargo run -p oxikube_workspace --features test-support --profile release-fast --example workspace_bench`
[[example]]
name = "workspace_bench"
required-features = ["test-support"]

# Frame cost of switching between two cluster tabs that each hold a 10 000-row table (test platform):
# `cargo run -p oxikube_workspace --features test-support --profile release-fast --example cluster_tab_bench`
[[example]]
name = "cluster_tab_bench"
required-features = ["test-support"]

[lints]
workspace = true
