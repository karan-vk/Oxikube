[package]
name = "oxikube_helm_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Helm releases, charts catalog, install/upgrade/rollback UI, repos."

[lib]
path = "src/oxikube_helm_ui.rs"
doctest = false

[dependencies]
gpui.workspace = true
oxikube_domain.workspace = true
oxikube_settings.workspace = true
oxikube_ui.workspace = true
oxikube_workspace.workspace = true

[dev-dependencies]
anyhow.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
oxikube_assets.workspace = true
oxikube_testkit = { workspace = true, features = ["gpui-test", "gpui-screenshot"] }
oxikube_workspace = { workspace = true, features = ["test-support"] }

[features]
default = []
# Headless GPU screenshot of the guidance banner (`tests/banner_screenshot.rs`, harness = false so
# it runs on the process main thread). Needs Metal / Vulkan, so never part of the default gate;
# the nightly workflow runs it: `cargo test -p oxikube_helm_ui --features screenshot --test
# banner_screenshot`.
screenshot = []

[[test]]
name = "banner_screenshot"
path = "tests/banner_screenshot.rs"
harness = false
required-features = ["screenshot"]

[lints]
workspace = true
