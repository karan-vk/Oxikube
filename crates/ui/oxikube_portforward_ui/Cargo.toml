[package]
name = "oxikube_portforward_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Port-forward manager panel and start dialog."

[lib]
path = "src/oxikube_portforward_ui.rs"
doctest = false

[dependencies]
futures.workspace = true
gpui.workspace = true
jiff.workspace = true
oxikube_app.workspace = true
oxikube_domain.workspace = true
oxikube_keymap.workspace = true
oxikube_ports.workspace = true
# `notify_coalesced`: the panel redraws at frame cadence however many changes arrive.
oxikube_runtime.workspace = true
oxikube_ui.workspace = true
oxikube_workspace.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
oxikube_assets.workspace = true
oxikube_testkit = { workspace = true, features = ["gpui-test"] }
oxikube_workspace = { workspace = true, features = ["test-support"] }
parking_lot.workspace = true
tokio.workspace = true

[lints]
workspace = true
