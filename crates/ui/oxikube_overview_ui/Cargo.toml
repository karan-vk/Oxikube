[package]
name = "oxikube_overview_ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Cluster overview dashboard, charts, pulses."

[lib]
path = "src/oxikube_overview_ui.rs"
doctest = false

[dependencies]
futures.workspace = true
gpui.workspace = true
jiff.workspace = true
oxikube_app.workspace = true
oxikube_domain.workspace = true
oxikube_keymap.workspace = true
oxikube_ports.workspace = true
oxikube_runtime.workspace = true
oxikube_ui.workspace = true
oxikube_workspace.workspace = true
tracing.workspace = true

[dev-dependencies]
anyhow.workspace = true
oxikube_assets.workspace = true
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
oxikube_testkit = { workspace = true, features = ["gpui-screenshot"] }
oxikube_workspace = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[features]
default = []
# `pulses::test_support`: a page with live-looking data and no cluster, for the screenshot test.
test-support = []
# Headless GPU screenshot of the pulses page (`tests/screenshot.rs`; harness = false so it runs on
# the process main thread). Needs Metal / Vulkan, so never part of the default gate; the nightly
# workflow runs it: `cargo test -p oxikube_overview_ui --features screenshot --test screenshot`.
screenshot = ["test-support"]

[[test]]
name = "screenshot"
path = "tests/screenshot.rs"
harness = false
required-features = ["screenshot"]

[lints]
workspace = true
