[package]
name = "oxikube_kube"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "kube-rs adapter: tolerant kubeconfig loading, ClientPool per context with exec/OIDC auth, aggregated discovery, typed + dynamic APIs, reflector feeds, hand-rolled Table API feed, SSA/dry-run/patch/delete, subresources, kubectl-equivalent algorithms (trigger cronjob, rollout undo, drain), logs with reconnect, exec/attach/port-forward over ws, metrics (k8s-metrics), events."

[lib]
path = "src/oxikube_kube.rs"
doctest = false

[dependencies]
backon.workspace = true
oxikube_domain.workspace = true
oxikube_ports.workspace = true
async-trait.workspace = true
futures.workspace = true
hex.workspace = true
http.workspace = true
# kube needs exactly one k8s-openapi version feature enabled (`latest`, set in the workspace).
k8s-openapi.workspace = true
kube.workspace = true
notify.workspace = true
parking_lot.workspace = true
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
base64.workspace = true
oxikube_logging.workspace = true
oxikube_testkit.workspace = true
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tower.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# `test-util`: paused clock for the CRD-watch debounce tests.
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# Enables tests that need a live kind cluster (`cargo xtask kind-up`; OXIKUBE_TEST_CONTEXT).
# Forwards to the testkit helpers (a dev-dependency) that the integration tests import.
integration = ["oxikube_testkit/integration"]

[lints]
workspace = true
