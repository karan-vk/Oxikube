[package]
name = "oxikube_cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "CloudDiscoveryPort adapters that shell out to installed aws/gcloud/az CLIs to list EKS/GKE/AKS clusters and build exec-auth kubeconfig entries."

[lib]
path = "src/oxikube_cloud.rs"
doctest = false

[dependencies]
async-trait.workspace = true
futures.workspace = true
oxikube_domain.workspace = true
oxikube_ports.workspace = true
parking_lot = { workspace = true, optional = true }
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tempfile.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
oxikube_testkit.workspace = true
parking_lot.workspace = true
oxikube_testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
# `testing::RecordedRunner`: a `ProcessRunner` that answers from recorded CLI output, for the
# provider adapters' tests (their own `cfg(test)` code sees it without the feature).
testing = ["dep:parking_lot"]

[lints]
workspace = true
