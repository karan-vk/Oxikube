id = "full-sample"
name = "Full Sample"
version = "1.2.3"
schema_version = 1
description = "Exercises every table"
authors = ["Someone <someone@example.com>"]
repository = "https://github.com/example/full-sample"
themes = ["themes/dark.json"]
icon_themes = ["icons/icons.json"]
capabilities = [
  { kind = "process:exec", command = "kubectl", args = ["get", "*"] },
  { kind = "download_file", host = "github.com", path = "/example/*" },
  { kind = "kube:read", contexts = ["kind-*"] },
]

[lib]
kind = "rust"
version = "0.1.0"

[[commands]]
id = "say-hello"
title = "Say Hello"
description = "Greets"
scopes = ["global", "cluster"]

[[commands]]
id = "other"
title = "Other"

[[context_servers]]
id = "echo"
