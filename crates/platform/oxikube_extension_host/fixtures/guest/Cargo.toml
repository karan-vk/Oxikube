# Test guest for `oxikube_extension_host::wasm_host`. Not a workspace member: it builds for
# wasm32-wasip2 and its output is checked in as `../guest.wasm`. Rebuild after editing:
#
#   cargo build --release --target wasm32-wasip2 \
#     --manifest-path crates/platform/oxikube_extension_host/fixtures/guest/Cargo.toml \
#     --target-dir target/wasm-fixture
#   cp target/wasm-fixture/wasm32-wasip2/release/oxikube_host_fixture.wasm \
#     crates/platform/oxikube_extension_host/fixtures/guest.wasm
[package]
name = "oxikube_host_fixture"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.62"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"

[workspace]
