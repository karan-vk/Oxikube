[package]
name = "oxikube_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "tokio <-> GPUI bridge (gpui_tokio), spawn_kube with abort-on-drop, frame-coalesced notify helpers, channels."

[lib]
path = "src/oxikube_runtime.rs"
doctest = false

[dependencies]
anyhow.workspace = true
dirs.workspace = true
gpui.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[features]
default = []
# Scripted headless frame driver (`perf::harness`) used by `oxikube --perf-scenario` and
# `cargo xtask perf`. Plain gpui API only; the binary's `perf-scenarios` feature turns it on.
perf-harness = []

[[example]]
name = "perf_overhead"
path = "examples/perf_overhead.rs"

[lints]
workspace = true
