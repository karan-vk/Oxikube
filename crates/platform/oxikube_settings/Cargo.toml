[package]
name = "oxikube_settings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "SettingsStore: default.json -> user settings.json (JSONC) -> per-cluster overrides, Settings trait + inventory registration, comment-preserving edits, schemars schema, notify hot reload (vendored Zed design)."

[lib]
path = "src/oxikube_settings.rs"
doctest = false

[dependencies]
dirs.workspace = true
futures.workspace = true
gpui.workspace = true
inventory.workspace = true
notify.workspace = true
oxikube_assets.workspace = true
oxikube_domain.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
serde_path_to_error.workspace = true
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-json.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

# Startup / hot-reload cost with a typical user file (E05-S13 budget).
[[example]]
name = "settings_load"
path = "examples/settings_load.rs"

[lints]
workspace = true
