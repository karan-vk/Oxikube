[package]
name = "oxikube_theme"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Zed theme-family JSON (schema v0.2.0) importer -> ThemeTokens, oxikube status-colour block, ThemeRegistry, system appearance, icon themes."

[lib]
path = "src/oxikube_theme.rs"
doctest = false

[dependencies]
futures.workspace = true
gpui.workspace = true
notify.workspace = true
oxikube_assets.workspace = true
oxikube_settings.workspace = true
parking_lot.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The `glyph_warm` example measures on the platform's real text system.
gpui_platform.workspace = true
tempfile.workspace = true

# The OS platform must be made on the main thread (AppKit), so this test is its own `main`.
[[test]]
name = "glyph_warm_platform"
harness = false

[lints]
workspace = true
