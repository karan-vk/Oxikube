apiVersion: batch/v1
kind: CronJob
metadata:
  name: fixtures-cron
  namespace: oxikube-fixtures
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: tick
              image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
              command: ["true"]
