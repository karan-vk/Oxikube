# One pod per interesting lifecycle state, for status/colour/filter tests.
# Running
apiVersion: v1
kind: Pod
metadata:
  name: state-running
  namespace: oxikube-fixtures
  labels:
    oxikube.dev/fixture-state: running
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
---
# ErrImagePull / ImagePullBackOff (the image does not exist)
apiVersion: v1
kind: Pod
metadata:
  name: state-imagepullbackoff
  namespace: oxikube-fixtures
  labels:
    oxikube.dev/fixture-state: imagepullbackoff
spec:
  containers:
    - name: missing
      image: registry.k8s.io/oxikube/does-not-exist:0.0.0
---
# Pending (no node satisfies the selector)
apiVersion: v1
kind: Pod
metadata:
  name: state-pending
  namespace: oxikube-fixtures
  labels:
    oxikube.dev/fixture-state: pending
spec:
  nodeSelector:
    oxikube.dev/never-matches: "true"
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
---
# Completed (Job pod that exits 0)
apiVersion: batch/v1
kind: Job
metadata:
  name: state-completed
  namespace: oxikube-fixtures
  labels:
    oxikube.dev/fixture-state: completed
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        oxikube.dev/fixture-state: completed
    spec:
      restartPolicy: Never
      containers:
        - name: done
          image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
          command: ["true"]
