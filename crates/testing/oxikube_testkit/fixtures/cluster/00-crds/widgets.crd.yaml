# Sample namespaced CRD with additionalPrinterColumns (E03-S06, E04 Table API work).
# `kubectl get widgets -n oxikube-fixtures` shows Name, Size, Replicas, Phase, Age, and
# (with -o wide) Owner. Applied before any CR; kind-up waits for it to be Established.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.test.oxikube.dev
spec:
  group: test.oxikube.dev
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
    listKind: WidgetList
    shortNames:
      - wdg
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                replicas:
                  type: integer
                owner:
                  type: string
              required: [size, replicas]
            status:
              type: object
              properties:
                phase:
                  type: string
      additionalPrinterColumns:
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
        - name: Owner
          type: string
          priority: 1
          jsonPath: .spec.owner
